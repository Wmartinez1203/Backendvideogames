# .github/workflows/devops-update-user.yml
name: Docker Image CI/CD for Update User Service TEST 6

on:
  push:
    paths:
      - 'Usersmanagement/update-user/**'
      - '.github/workflows/devops-update-user.yml'
    branches: ["dev"]
  pull_request:
    paths:
      - 'Usersmanagement/update-user/**'
      - '.github/workflows/devops-update-user.yml'
    branches: ["QA", "main"]

jobs:
  build-and-deploy:
    name: Build, Push and Deploy Update-User Service
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: usersmanagement-update-user

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build Usersmanagement/update-user/. \
            --file Usersmanagement/update-user/Dockerfile \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            set -e

            # Instalar Docker si hace falta
            if ! command -v docker &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo usermod -aG docker $USER
            fi

            # Crear archivo de entorno
            echo "APP_PORT=3001"                   > ~/update-user.env
            echo "DB_HOST=${{ secrets.DB_HOST }}"     >> ~/update-user.env
            echo "DB_USER=${{ secrets.DB_USER }}"     >> ~/update-user.env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> ~/update-user.env
            echo "DB_NAME=${{ secrets.DB_NAME }}"      >> ~/update-user.env
            echo "DB_PORT=${{ secrets.DB_PORT }}"      >> ~/update-user.env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> ~/update-user.env
            echo "PORT=3001"                        >> ~/update-user.env

            # Pull última imagen
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            # Detener y eliminar contenedor antiguo
            if sudo docker ps -aq -f name=${{ env.IMAGE_NAME }}; then
              sudo docker stop ${{ env.IMAGE_NAME }} || true
              sudo docker rm ${{ env.IMAGE_NAME }} || true
            fi

            # Iniciar nuevo contenedor en 3001:3001
            sudo docker run -d --name ${{ env.IMAGE_NAME }} \
              -p 3001:3001 \
              --env-file ~/update-user.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            # Verificar
            if sudo docker ps -f name=${{ env.IMAGE_NAME }} | grep -q ${{ env.IMAGE_NAME }}; then
              echo "✅ Deployment successful"
              rm -f ~/update-user.env
            else
              echo "❌ Deployment failed"
              exit 1
            fi
