name: Docker Image CI/CD for Create User Service

on:
  push:
    paths:
      - 'Usersmanagement/create-user/**'
      - '.github/workflows/devops-create-user.yml'
    branches: [ "dev" ]
  pull_request:
    paths:
      - 'Usersmanagement/create-user/**'
      - '.github/workflows/devops-create-user.yml'
    branches:
      - "QA"
      - "main"

jobs:
  build-and-deploy:
    name: Build, Push Docker Image and Deploy
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: usersmanagement-create-user

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build Usersmanagement/create-user/. --file Usersmanagement/create-user/Dockerfile \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            set -e

            echo "==> Installing Docker (if needed)"
            if ! command -v docker &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo usermod -aG docker $USER
            fi

            echo "==> Creating environment file"
            echo "APP_PORT=${{ secrets.APP_PORT }}" > ~/create-user.env
            echo "DB_HOST=${{ secrets.DB_HOST }}" >> ~/create-user.env
            echo "DB_USER=${{ secrets.DB_USER }}" >> ~/create-user.env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> ~/create-user.env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> ~/create-user.env
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> ~/create-user.env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> ~/create-user.env

            echo "==> Pulling Docker image"
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            echo "==> Stopping old container (if exists)"
            if sudo docker ps -aq -f name=usersmanagement-create-user; then
              sudo docker stop usersmanagement-create-user || true
              sudo docker rm usersmanagement-create-user || true
            else
              echo "No previous container to stop or remove"
            fi

            echo "==> Running new container"
            sudo docker run -d --name ${{ env.IMAGE_NAME }} -p ${{ secrets.APP_PORT }}:8080 \
              --env-file ~/create-user.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            echo "==> Verifying container startup"
            if sudo docker ps -f name=${{ env.IMAGE_NAME }} | grep ${{ env.IMAGE_NAME }}; then
              echo "✅ Deployment successful"
              echo "==> Cleaning up environment file"
              rm -f ~/create-user.env
            else
              echo "❌ Deployment failed"
              exit 1
            fi
