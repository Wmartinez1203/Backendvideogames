name: Docker Image CI/CD for Delete User Service

on:
  push:
    paths:
      - 'Usersmanagement/delete-user/**'
      - '.github/workflows/devops-delete-user.yml'
    branches: [ "dev" ]
  pull_request:
    paths:
      - 'Usersmanagement/delete-user/**'
      - '.github/workflows/devops-delete-user.yml'
    branches:
      - "QA"
      - "main"

jobs:
  build-and-deploy:
    name: Build, Push Docker Image and Deploy
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: usersmanagement-delete-user

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build Usersmanagement/delete-user/. --file Usersmanagement/delete-user/Dockerfile \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            set -e

            echo "==> Installing Docker (if needed)"
            if ! command -v docker &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo usermod -aG docker $USER
            fi

            echo "==> Creating environment file"
            echo "APP_PORT=${{ secrets.APP_PORT }}" > ~/delete-user.env
            echo "PG_HOST=${{ secrets.PG_HOST }}" >> ~/delete-user.env
            echo "PG_USER=${{ secrets.PG_USER }}" >> ~/delete-user.env
            echo "PG_PASSWORD=${{ secrets.PG_PASSWORD }}" >> ~/delete-user.env
            echo "PG_DATABASE=${{ secrets.PG_DATABASE }}" >> ~/delete-user.env
            echo "PG_PORT=${{ secrets.PG_PORT }}" >> ~/delete-user.env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> ~/delete-user.env
            echo "PORT=8000" >> ~/delete-user.env  # Interno del contenedor

            echo "==> Pulling Docker image"
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            echo "==> Stopping old container (if exists)"
            if sudo docker ps -aq -f name=${{ env.IMAGE_NAME }}; then
              sudo docker stop ${{ env.IMAGE_NAME }} || true
              sudo docker rm ${{ env.IMAGE_NAME }} || true
            else
              echo "No previous container to stop or remove"
            fi

            echo "==> Running new container on port 3002"
            sudo docker run -d --name ${{ env.IMAGE_NAME }} -p 3002:8000 \
              --env-file ~/delete-user.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            echo "==> Verifying container startup"
            if sudo docker ps -f name=${{ env.IMAGE_NAME }} | grep ${{ env.IMAGE_NAME }}; then
              echo "✅ Deployment successful"
              echo "==> Cleaning up environment file"
              rm -f ~/delete-user.env
            else
              echo "❌ Deployment failed"
              exit 1
            fi
