name: Deploy register-new-game Microservice

on:
  push:
    branches:
      - main
    paths:
      - 'register-new-game/**'
      - '.github/workflows/devops-register-new-game.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd register-new-game
          npm install

      - name: Build microservice
        run: |
          cd register-new-game
          npm run build

      - name: Copy files to remote server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          source: "register-new-game/"
          target: "~/register-new-game/"

      - name: Deploy microservice via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            cd ~/register-new-game
            export MONGO_URL="${{ secrets.MONGO_URL }}"
            export PORT=${{ vars.REGISTER_NEW_GAME_PORT }}
            pm2 delete register-new-game || true
            pm2 start dist/index.js --name register-new-game --env production

      - name: Verify deployment
        run: |
          curl --fail http://${{ secrets.REMOTE_HOST }}:${{ vars.REGISTER_NEW_GAME_PORT }}/health || exit 1