# .github/workflows/devops-register-new-game.yml
name: Docker Image CI/CD for Register New Game Service

on:
  push:
    paths:
      - 'Usersmanagement/register-new-game/**'
      - '.github/workflows/devops-register-new-game.yml'
    branches: ["dev"]
  pull_request:
    paths:
      - 'Usersmanagement/register-new-game/**'
      - '.github/workflows/devops-register-new-game.yml'
    branches: ["QA", "main"]

jobs:
  build-and-deploy:
    name: Build, Push and Deploy Register-New-Game Service
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: register-new-game

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven local repository
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('Usersmanagement/register-new-game/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build JAR with Maven
        run: |
          cd Usersmanagement/register-new-game
          mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build Usersmanagement/register-new-game/. \
            --file Usersmanagement/register-new-game/Dockerfile \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            set -e

            echo "==> Installing Docker (if needed)"
            if ! command -v docker &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo usermod -aG docker $USER
            fi

            echo "==> Pruning unused Docker objects to free space"
            sudo docker system prune -af --volumes

            echo "==> Creating environment file"
            cat > ~/register-new-game.env <<EOF
            SPRING_DATA_MONGODB_URI=${{ secrets.MONGO_URI }}
            SPRING_DATA_MONGODB_DATABASE=${{ secrets.MONGO_DB }}
            SERVER_PORT=3012
            EOF

            echo "==> Pulling latest image"
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            echo "==> Stopping old container (if exists)"
            if sudo docker ps -q -f name=${{ env.IMAGE_NAME }}; then
              sudo docker stop ${{ env.IMAGE_NAME }} || true
              sudo docker rm ${{ env.IMAGE_NAME }} || true
            fi

            echo "==> Running new container on port 3012"
            sudo docker run -d --name ${{ env.IMAGE_NAME }} \
              -p 3012:3012 \
              --env-file ~/register-new-game.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            echo "==> Verifying container startup"
            if sudo docker ps -f name=${{ env.IMAGE_NAME }} | grep -q ${{ env.IMAGE_NAME }}; then
              echo "✅ Deployment successful"
              rm -f ~/register-new-game.env
            else
              echo "❌ Deployment failed"
              exit 1
            fi
