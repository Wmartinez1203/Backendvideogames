# .github/workflows/devops-register-new-game.yml
name: Docker Image CI/CD for Register New Game Service

on:
  push:
    paths:
      - 'Usersmanagement/register-new-game/**'
      - '.github/workflows/devops-register-new-game.yml'
    branches:
      - dev
  pull_request:
    paths:
      - 'Usersmanagement/register-new-game/**'
      - '.github/workflows/devops-register-new-game.yml'
    branches:
      - QA
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: register-new-game

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Build JAR with Maven
        working-directory: Usersmanagement/register-new-game   # Ajusta si tu carpeta difiere
        run: mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build Usersmanagement/register-new-game/. \
            --file Usersmanagement/register-new-game/Dockerfile \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            set -e

            # Instalar Docker si falta
            if ! command -v docker &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y docker.io
            fi

            # Limpiar espacio en Docker
            sudo docker system prune -af --volumes

            # Crear archivo de entorno
            echo "SPRING_DATA_MONGODB_URI=${{ secrets.MONGO_URI }}" > ~/register-new-game.env
            echo "SPRING_DATA_MONGODB_DATABASE=${{ secrets.MONGO_DB }}" >> ~/register-new-game.env
            echo "SERVER_PORT=3012" >> ~/register-new-game.env

            # Pull y despliegue
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            if sudo docker ps -q -f name=${{ env.IMAGE_NAME }}; then
              sudo docker rm -f ${{ env.IMAGE_NAME }}
            fi
            sudo docker run -d --name ${{ env.IMAGE_NAME }} \
              -p 3012:3012 \
              --env-file ~/register-new-game.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            # Limpieza de env file
            rm -f ~/register-new-game.env
