name: Docker Image CI/CD for Register New Game Service tes1

on:
  push:
    paths:
      - 'Backendvideogames/Catalog/register-new-game/**'
      - '.github/workflows/devops-register-new-game.yml'
    branches: [ "main", "dev" ]
  pull_request:
    paths:
      - 'Backendvideogames/Catalog/register-new-game/**'
      - '.github/workflows/devops-register-new-game.yml'
    branches:
      - "QA"
      - "main"

jobs:
  build-and-deploy:
    name: Build, Push Docker Image and Deploy
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: register-new-game
      APP_PORT: 3012

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests
        working-directory: ./Backendvideogames/Catalog/register-new-game

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build Backendvideogames/Catalog/register-new-game/. --file Backendvideogames/Catalog/register-new-game/Dockerfile \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            set -e

            echo "==> Installing Docker (if needed)"
            if ! command -v docker &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo usermod -aG docker $USER
            fi

            echo "==> Creating environment file"
            echo "SPRING_DATA_MONGODB_URI=mongodb://root:example@3.219.108.100:27017/" > ~/register-new-game.env
            echo "SERVER_PORT=${APP_PORT}" >> ~/register-new-game.env

            echo "==> Pulling Docker image"
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            echo "==> Stopping old container (if exists)"
            if sudo docker ps -aq -f name=${{ env.IMAGE_NAME }}; then
              sudo docker stop ${{ env.IMAGE_NAME }} || true
              sudo docker rm ${{ env.IMAGE_NAME }} || true
            else
              echo "No previous container to stop or remove"
            fi

            echo "==> Running new container"
            sudo docker run -d --name ${{ env.IMAGE_NAME }} -p ${APP_PORT}:${APP_PORT} \
              --env-file ~/register-new-game.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            echo "==> Verifying container startup"
            if sudo docker ps -f name=${{ env.IMAGE_NAME }} | grep ${{ env.IMAGE_NAME }}; then
              echo "✅ Deployment successful"
              echo "==> Cleaning up environment file"
              rm -f ~/register-new-game.env
            else
              echo "❌ Deployment failed"
              exit 1
            fi
