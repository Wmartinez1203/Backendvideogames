name: Docker CI/CD for Register New Game

on:
  push:
    paths:
      - 'Catalog/register-new-game/**'
      - '.github/workflows/devops-register-new-game.yml'
    branches: [ "dev" ]
  pull_request:
    paths:
      - 'Catalog/register-new-game/**'
      - '.github/workflows/devops-register-new-game.yml'
    branches:
      - "QA"
      - "main"

jobs:
  build-and-deploy:
    name: Build, Push Docker Image and Deploy to EC2
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: register-new-game

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR with Maven
        working-directory: Catalog/register-new-game
        run: mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build Catalog/register-new-game/ --file Catalog/register-new-game/Dockerfile \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            set -e

            echo "==> Creating environment file"
            echo "SPRING_DATA_MONGODB_URI=mongodb://root:example@3.219.108.100:27058/" > ~/register-new-game.env
            echo "SPRING_DATA_MONGODB_DATABASE=game_catalog_db" >> ~/register-new-game.env
            echo "SERVER_PORT=3012" >> ~/register-new-game.env

            echo "==> Pulling Docker image"
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            echo "==> Stopping old container (if exists)"
            if sudo docker ps -aq -f name=${{ env.IMAGE_NAME }}; then
              sudo docker stop ${{ env.IMAGE_NAME }} || true
              sudo docker rm ${{ env.IMAGE_NAME }} || true
            fi

            echo "==> Running new container"
            sudo docker run -d --name ${{ env.IMAGE_NAME }} -p 3012:3012 \
              --env-file ~/register-new-game.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            echo "==> Cleaning up environment file"
            rm -f ~/register-new-game.env
