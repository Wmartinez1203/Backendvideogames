name: 🚀 CI/CD RoleManagementService

on:
  push:
    branches:
      - main
    paths:
      - 'Usersmanagement/RoleManagementService/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: wmartinez1203/role-management-service
      CONTAINER_PORT: 3009

    steps:
    - name: 🧾 Checkout repo
      uses: actions/checkout@v3

    - name: 🐳 Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 🛠️ Build Docker image
      run: |
        docker build -t $IMAGE_NAME -f Usersmanagement/RoleManagementService/dockerfile .

    - name: 📦 Push image to DockerHub
      run: |
        docker push $IMAGE_NAME

    - name: 🚀 Deploy to EC2
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          docker pull $IMAGE_NAME
          docker stop role-management-service || true
          docker rm role-management-service || true
          docker run -d --name role-management-service -p 3009:80 $IMAGE_NAME
