name: Docker Image CI/CD for Role Management Service

on:
  push:
    paths:
      - 'Usersmanagement/RoleManagementService/**'
      - '.github/workflows/devops-role-management-service.yml'
    branches: [ "main", "dev" ]
  pull_request:
    paths:
      - 'Usersmanagement/RoleManagementService/**'
      - '.github/workflows/devops-role-management-service.yml'
    branches: [ "QA", "main" ]

jobs:
  build-and-deploy:
    name: Build, Push Docker Image and Deploy
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: usersmanagement-role-management
      APP_PORT: 3009

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Publish .NET project
        run: dotnet publish -c Release -o out
        working-directory: ./Usersmanagement/RoleManagementService

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build Usersmanagement/RoleManagementService/. --file Usersmanagement/RoleManagementService/dockerfile \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            set -e
            export APP_PORT=${{ env.APP_PORT }}

            echo "==> Creating environment file"
            echo "ConnectionStrings__DefaultConnection=${{ secrets.DB_CONNECTION_STRING }}" > ~/role-management.env
            echo "ASPNETCORE_ENVIRONMENT=Production" >> ~/role-management.env
            echo "DOTNET_RUNNING_IN_CONTAINER=true" >> ~/role-management.env

            echo "==> Pulling Docker image"
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            echo "==> Stopping old container"
            if sudo docker ps -aq -f name=${{ env.IMAGE_NAME }}; then
              sudo docker stop ${{ env.IMAGE_NAME }} || true
              sudo docker rm ${{ env.IMAGE_NAME }} || true
            fi

            echo "==> Running new container"
            sudo docker run -d --name ${{ env.IMAGE_NAME }} -p ${APP_PORT}:80 \
              --env-file ~/role-management.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            echo "==> Cleaning up"
            rm -f ~/role-management.env
