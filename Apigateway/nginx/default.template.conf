
    upstream create_user_service { 
        server ${CREATE_USER_HOST}:${CREATE_USER_PORT}; 
    }
    upstream delete_user_service { 
        server ${DELETE_USER_HOST}:${DELETE_USER_PORT}; 
    }
    upstream update_user_service { 
        server ${UPDATE_USER_HOST}:${UPDATE_USER_PORT}; 
    }
    upstream game_register_service { 
        server ${REGISTER_GAME_HOST}:${REGISTER_GAME_PORT}; 
    }

    upstream graphql_user_service { 
    server ${GRAPHQL_USER_HOST}:${GRAPHQL_USER_PORT}; 
    }

    upstream soap_create_role { 
    server ${SOAP_CREATE_ROLE_HOST}:${SOAP_CREATE_ROLE_PORT}; 
    }
    upstream soap_delete_role { 
    server ${SOAP_DELETE_ROLE_HOST}:${SOAP_DELETE_ROLE_PORT}; 
    }
    upstream soap_update_role { 
    server ${SOAP_UPDATE_ROLE_HOST}:${SOAP_UPDATE_ROLE_PORT}; 
    }
    upstream soap_getbyid_role { 
    server ${SOAP_GETBYID_ROLE_HOST}:${SOAP_GETBYID_ROLE_PORT}; 
    }
    upstream soap_getall_role { 
    server ${SOAP_GETALL_ROLE_HOST}:${SOAP_GETALL_ROLE_PORT}; 
    }

    server {
        listen 80;

        location /api/usuarios/create {
            proxy_pass http://create_user_service/api/usuarios;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/api/usuarios/delete/\d+$ {
            proxy_pass http://delete_user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/api/usuarios/update/\d+$ {
            proxy_pass http://update_user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/games/register {
            proxy_pass http://game_register_service/api/games/register;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /graphql {
            proxy_pass http://graphql_user_service/graphql;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /soap/roles/create {
            proxy_pass http://soap_create_role/RoleService.svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /soap/roles/delete {
            proxy_pass http://soap_delete_role/RoleService.svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /soap/roles/update {
            proxy_pass http://soap_update_role/RoleService.svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /soap/roles/getbyid {
            proxy_pass http://soap_getbyid_role/RoleService.svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /soap/roles/getall {
            proxy_pass http://soap_getall_role/RoleService.svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            return 404;
        }
    }


